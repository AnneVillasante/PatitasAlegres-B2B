spring.config.import=optional:file:.env[.properties]
server.port=8008
spring.application.name=farmacia-service

spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/clinica_farmacia?useSSL=false&serverTimezone=America/Lima&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:svc_farmacia}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

esb.url=${ESB_URL:http://localhost:8290/services}
esb.proxy.pagos=PagosProxy
esb.proxy.notificaciones=NotificacionesProxy
esb.timeout=30000

spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://127.0.0.1:61616}
spring.activemq.user=${ACTIVEMQ_USER:admin}
spring.activemq.password=${ACTIVEMQ_PASSWORD:admin}
spring.activemq.pool.enabled=false
spring.activemq.pool.max-connections=10
spring.activemq.packages.trust-all=true
spring.jms.pub-sub-domain=true
spring.jms.listener.auto-startup=${ACTIVEMQ_LISTENER_ENABLED:true}

logging.level.com.clinica.farmacia=DEBUG
logging.level.org.springframework.jms=INFO
